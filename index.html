<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>STRANDED</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="gameRoot">
      <canvas id="gameCanvas" width="1280" height="720"></canvas>

      <div id="menuOverlay" class="overlay visible">
        <div class="menuPanel">
          <h1>STRANDED</h1>
          <p id="menuSubtitle">A survivor's story on a lonely island</p>

          <div class="langBlock">
            <h2>Language / Taal / Idioma / Langue / 语言</h2>
            <div class="langGrid">
              <button class="langBtn selected" data-lang="nl">Nederlands</button>
              <button class="langBtn" data-lang="en">English</button>
              <button class="langBtn" data-lang="es">Español</button>
              <button class="langBtn" data-lang="fr">Français</button>
              <button class="langBtn" data-lang="zh">中文</button>
            </div>
          </div>

          <button id="startBtn" class="startBtn">Start</button>
        </div>
      </div>

      <div id="hud" class="hidden">
        <div class="statsPanel panel">
          <div class="stat">
            <label id="hungerLabel">Hunger</label>
            <div class="bar"><div id="hungerBar" class="fill hunger"></div></div>
            <span id="hungerValue">80</span>
          </div>
          <div class="stat">
            <label id="thirstLabel">Thirst</label>
            <div class="bar"><div id="thirstBar" class="fill thirst"></div></div>
            <span id="thirstValue">80</span>
          </div>
          <div class="stat">
            <label id="healthLabel">Health</label>
            <div class="bar"><div id="healthBar" class="fill health"></div></div>
            <span id="healthValue">100</span>
          </div>
          <div class="stat">
            <label id="energyLabel">Energy</label>
            <div class="bar"><div id="energyBar" class="fill energy"></div></div>
            <span id="energyValue">80</span>
          </div>
        </div>

        <div class="infoPanel panel">
          <h3 id="objectiveTitle">Objectives</h3>
          <ul id="questList"></ul>
        </div>

        <div class="inventoryPanel panel">
          <h3 id="inventoryTitle">Inventory</h3>
          <div id="inventoryList"></div>
        </div>

        <div id="interactBubble" class="interactBubble hidden"></div>
      </div>

      <div id="dialogBox" class="panel dialog hidden">
        <div class="dialogHeader">
          <h3 id="dialogName">NPC</h3>
          <button id="closeDialog">×</button>
        </div>
        <div id="dialogText"></div>
        <div id="dialogOptions"></div>
      </div>

      <div id="touchControls" class="touchControls hidden">
        <div class="pad">
          <button class="touchBtn" data-key="up">▲</button>
          <div class="row">
            <button class="touchBtn" data-key="left">◀</button>
            <button class="touchBtn" data-key="down">▼</button>
            <button class="touchBtn" data-key="right">▶</button>
          </div>
        </div>
        <button id="touchAction" class="touchAction">E</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
